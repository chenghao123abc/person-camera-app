<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>人物辨識相機</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-stage" aria-label="人物辨識相機">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="emptyState" class="empty-state">
          <h1>人物辨識相機</h1>
          <p>開啟相機後，畫面中的人會被即時標示。</p>
          <button id="startButton" type="button">開啟相機</button>
        </div>
      </section>

      <footer class="control-bar">
        <div>
          <span class="label">狀態</span>
          <strong id="statusText">等待開啟</strong>
        </div>
        <div>
          <span class="label">人數</span>
          <strong id="countText">0</strong>
        </div>
        <button id="switchButton" type="button" disabled>切換鏡頭</button>
      </footer>
    </main>
  </body>
</html>
